<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2DCC2">
  <title>年度回顧｜GGteens</title>
  <style>
    :root {
      color-scheme: light;
      --cream: #F2DCC2;
      --gold: #BF9A56;
      --coral: #F28651;
      --ink: #3E3430;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--cream);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
    }
    main {
      width: min(100%, 640px);
      padding: clamp(32px, 8vw, 72px) 24px;
      text-align: center;
      background: rgba(255, 250, 242, .82);
      border: 2px solid var(--gold);
      border-radius: 24px;
      box-shadow: 8px 8px 0 rgba(191, 154, 86, .22);
    }
    p {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: .08em;
    }
    .accent {
      width: 64px;
      height: 6px;
      margin: 24px auto 0;
      border-radius: 999px;
      background: var(--coral);
    }
  </style>
</head>
<body>
  <main>
    <p>頁面建置中</p>
    <div class="accent" aria-hidden="true"></div>
  </main>
</body>
</html>
